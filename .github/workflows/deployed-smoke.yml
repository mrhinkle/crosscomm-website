name: Deployed smoke
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "https origin to check, such as https://crosscomm-website.vercel.app"
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the deployed origin
        env:
          DEPLOY_SMOKE_URL: ${{ inputs.origin }}
        run: node --experimental-strip-types scripts/deployed-smoke.ts
