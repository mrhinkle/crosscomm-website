<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CrossComm social card</title>
    <style>
      @font-face {
        font-family: "Archivo Narrow";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("../node_modules/@fontsource/archivo-narrow/files/archivo-narrow-latin-700-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
      }
      .card {
        width: 1200px;
        height: 630px;
        background: #272f39;
        position: relative;
        overflow: hidden;
      }
      .rule {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 8px;
        background: #f2994a;
      }
      img {
        position: absolute;
        left: 72px;
        top: 210px;
        width: 480px;
        height: auto;
      }
      p {
        position: absolute;
        left: 72px;
        bottom: 88px;
        margin: 0;
        color: #fcfdfe;
        font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
        font-weight: 700;
        font-style: normal;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule"></div>
      <img src="../client/public/logo.png" width="676" height="129" alt="" />
      <p>Make the next thing.</p>
    </div>
  </body>
</html>
